name: Verify probability module

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Analytical and Monte Carlo regression checks
        run: python -m unittest discover -s tests -v
      - name: Reproduce synthetic example without optional dependencies
        run: python demo.py --no-plot --output-dir outputs/ci --seed 721 --samples 20000
